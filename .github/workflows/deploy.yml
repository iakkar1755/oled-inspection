name: Deploy OLED Inspection

on:
  workflow_run:
    workflows: ["Python source checks"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oled-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    environment: production

    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Select tested commit
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$TESTED_SHA"
          else
            SHA="$MANUAL_SHA"
          fi

          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_SHA: ${{ steps.version.outputs.sha }}
        run: |

     	  test -n "$VM_HOST" || { echo "::error::VM_HOST is empty"; exit 1; }
          test -n "$VM_USER" || { echo "::error::VM_USER is empty"; exit 1; }
          test -n "$DEPLOY_SHA" || { echo "::error::DEPLOY_SHA is empty"; exit 1; }
          
	  ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$VM_USER@$VM_HOST" "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          SHA="$1"
          REPO="$HOME/oled-inspection-repo"

          cd "$REPO"
          test -z "$(git status --porcelain)"

          git fetch origin main
          git cat-file -e "$SHA^{commit}"
          git checkout --detach "$SHA"

          bash scripts/deploy.sh
          REMOTE